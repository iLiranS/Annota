[package]
name = "Annota"
version = "0.1.0"
description = "Annota desktop app"
authors = ["Annota"]
edition = "2021"

[lib]
name = "annota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.7"
image = "0.25"
tauri-plugin-clipboard-manager = "2.3.2"
webp = "0.3.1"
tauri-plugin-window-state = "2.4.1"
font-kit = "0.14.3"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-os = "2"
argon2 = "0.5"
# Fix: removed tauri-plugin-sql — replaced by custom rusqlite bridge
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
base64 = "0.22.1"
tauri-plugin-single-instance = "2.4.2"
[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
