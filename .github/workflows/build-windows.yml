name: Build Windows (manual)
run-name: annota-windows-v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install deps
        working-directory: ./
        run: pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version
        run: pnpm version ${{ inputs.version }} --no-git-tag-version

      - name: Build Tauri (Windows)
        run: pnpm tauri build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_ENABLE_CLOUD: true

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: annota-windows-v${{ inputs.version }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
